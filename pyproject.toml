[project]
name = "rcac-support"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "pranay", email = "pra1997pranay@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "tiktoken>=0.14.0",
]

[project.scripts]
rcac-support = "rcac_support:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.uv]
package = false   # an app we run, not a library to install

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can "import app"